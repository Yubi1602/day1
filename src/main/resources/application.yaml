spring:
  application:
    name: day1

  output:
    ansi:
      enabled: always

  profiles:
    active: ${APP_PROFILE:dev}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    issuer: yoedu-demo
    secret: yoedu-demo-secret-key-12345678901234567890
    access-token-ttl-minutes: 480
    refresh-token-ttl-days: 7