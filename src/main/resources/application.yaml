spring:
  application:
    name: day1

  output:
    ansi:
      enabled: always

  profiles:
    active: ${APP_PROFILE:dev}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

server:
  port: 8080